# Server block nginx pour ws.aremond.ovh (WS ATLAS).
# Installation :
#   sudo cp deploy/vps/nginx-ws-aremond.conf /etc/nginx/sites-available/ws.aremond.ovh
#   sudo ln -sf /etc/nginx/sites-available/ws.aremond.ovh /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS — après propagation DNS, lancer :
#   sudo certbot --nginx -d ws.aremond.ovh
# Certbot réécrira ce fichier : listen 443 ssl + redirection 80 -> 443,
# avec renouvellement automatique. Aucun autre site du VPS n'est touché.

server {
    listen 80;
    listen [::]:80;
    server_name ws.aremond.ovh;

    # L'app limite elle-même les uploads à ~13 MB ; 20m = marge.
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

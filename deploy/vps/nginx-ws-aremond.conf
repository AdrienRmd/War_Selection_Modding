# Server block nginx pour ws.aremond.ovh (WS ATLAS).
# Installation :
#   sudo cp deploy/vps/nginx-ws-aremond.conf /etc/nginx/sites-available/ws.aremond.ovh
#   sudo ln -sf /etc/nginx/sites-available/ws.aremond.ovh /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS — après propagation DNS, lancer :
#   sudo certbot --nginx -d ws.aremond.ovh
# Certbot réécrira ce fichier : listen 443 ssl + redirection 80 -> 443,
# avec renouvellement automatique. Aucun autre site du VPS n'est touché.

server {
    listen 80;
    listen [::]:80;
    server_name ws.aremond.ovh;

    # L'app limite elle-même les uploads à ~13 MB ; 20m = marge.
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Anti-forgery X-Forwarded-For : $proxy_add_x_forwarded_for ajouterait
        # $remote_addr À LA SUITE d'une chaîne potentiellement forgée par le
        # client, qui pourrait alors usurper une autre IP auprès du worker
        # (contournement du rate-limit par IP). $remote_addr ÉCRASE au
        # contraire tout en-tête entrant par l'adresse réelle du pair TCP.
        # Le worker lit le DERNIER hop du XFF, qui est ici notre propre
        # écriture — invariant supposé par lib/auth-server.ts (clientIp).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

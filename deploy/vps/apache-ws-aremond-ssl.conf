# Vhost Apache 2.4 (SSL) pour ws.aremond.ovh — WS ATLAS.
# Fichier de référence du kit ; à adapter si votre layout Apache diffère.
#
# Rôle : reverse proxy HTTPS devant le worker wrangler (workerd) qui écoute
# sur 127.0.0.1:8787. Le worker est joint en HTTP sur la boucle locale, donc
# `request.url` y est construit en http:// alors que les navigateurs parlent
# https. C'est `RequestHeader set X-Forwarded-Proto "https"` qui transmet le
# vrai protocole au worker : sans lui, la vérification same-origin rejette en
# 403 tous les POST légitimes (signin/signup/mutations) et le cookie de
# session perd son flag Secure. `set` (et non add/append) ÉCRASE toute valeur
# envoyée par le client : seul Apache décide du proto transmis au worker.
#
# Prérequis : mod_ssl, mod_proxy, mod_proxy_http et mod_headers activés, et
# un certificat Let's Encrypt pour ws.aremond.ovh. Installation :
#
#   sudo a2enmod ssl proxy proxy_http headers
#   # certificat absent ? l'émettre d'abord :
#   #   sudo certbot certonly --apache -d ws.aremond.ovh
#   sudo cp /opt/ws-atlas/deploy/vps/apache-ws-aremond-ssl.conf \
#           /etc/apache2/sites-available/ws.aremond.ovh-ssl.conf
#   sudo a2ensite ws.aremond.ovh-ssl
#   sudo apachectl configtest && sudo systemctl reload apache2
#
# Ce fichier ne décrit que le vhost 443 ; gardez votre vhost :80 existant
# (ou ajoutez une simple redirection HTTPS). Il ne touche à aucun autre site
# du VPS. Le port 8787 ne doit rester joignable que sur 127.0.0.1.

<VirtualHost *:443>
    ServerName ws.aremond.ovh

    # --- TLS (certificats Let's Encrypt standards) ---
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/ws.aremond.ovh/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/ws.aremond.ovh/privkey.pem
    # Protocoles/ciphers recommandés par certbot (SSLProtocol, SSLCipherSuite...)
    Include /etc/letsencrypt/options-ssl-apache.conf

    # --- Reverse proxy vers le worker ---
    # Le worker doit voir le nom d'hôte d'origine (il en déduit req.url).
    ProxyPreserveHost On

    # Proto réellement vu par le navigateur : surcharge toute valeur forgée
    # par le client. Indispensable au same-origin et au flag Secure du cookie.
    RequestHeader set X-Forwarded-Proto "https"

    # Anti-forgery X-Forwarded-For : le client peut envoyer une chaîne XFF
    # arbitraire pour usurper une autre IP auprès du worker (contournement du
    # rate-limit par IP). On purge donc tôt (`early`, avant toute autre
    # phase) toute chaîne entrante, puis on réécrit l'en-tête avec la seule
    # adresse certaine : le pair TCP vu par Apache (REMOTE_ADDR). Le worker
    # lit le DERNIER hop du XFF, qui est ici notre propre écriture — un
    # invariant que lib/auth-server.ts (clientIp) suppose.
    RequestHeader unset X-Forwarded-For early
    RequestHeader set X-Forwarded-For "expr=%{REMOTE_ADDR}"

    # Uploads : l'application se limite elle-même à ~13 MB ; 20 MB = marge.
    LimitRequestBody 20971520

    ProxyPass / http://127.0.0.1:8787/
    ProxyPassReverse / http://127.0.0.1:8787/
</VirtualHost>
